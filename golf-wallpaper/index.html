<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Golf Wallpaper</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #10281a; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: crosshair; touch-action: none; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/**
 * GOLF WALLPAPER - top-down mini golf.
 *  - In a browser: drag back from anywhere and release to putt (slingshot style).
 *  - Idle for a few seconds (or pinned behind the desktop, where it gets no input): a CPU golfer plays on its own.
 * Options (URL query): ?hud=0|1  ?auto=0|1  ?delay=SECONDS (idle time before CPU plays, default 5)  ?fps=15-120
 */
(function () {
  'use strict';

  const W = 1600, H = 900;
  const R = 12;            // ball radius
  const CUP_R = 20;        // cup radius
  const K = 1.25;          // rolling damping (1/s): a putt of speed v travels about v / K pixels
  const MAXV = 1500;       // max putt speed
  const REST = 0.8;        // wall bounciness
  const CAPTURE_SPEED = 420;

  const params = new URLSearchParams(location.search);
  const opts = {
    hud: params.get('hud') !== '0',
    auto: params.get('auto') !== '0',
    delay: Math.max(1, parseFloat(params.get('delay')) || 5),
    fps: Math.min(120, Math.max(15, parseInt(params.get('fps'), 10) || 60))
  };

  // ---- Course data ----------------------------------------------------------------
  // poly: course outline (also the walls). obst: solid blocks. route: waypoints the CPU uses when there's no clear line to the cup.
  const HOLES = [
    { par: 2, tee: [300, 450], cup: [1300, 450],
      poly: [[200, 330], [1400, 330], [1400, 570], [200, 570]],
      obst: [[[740, 415], [800, 415], [800, 485], [740, 485]]],
      water: null, sand: null, route: [[770, 372]] },
    { par: 3, tee: [300, 300], cup: [1000, 640],
      poly: [[200, 200], [1100, 200], [1100, 720], [900, 720], [900, 400], [200, 400]],
      obst: [], water: null, sand: null, route: [[1000, 300]] },
    { par: 3, tee: [260, 450], cup: [1340, 450],
      poly: [[150, 200], [1450, 200], [1450, 700], [150, 700]],
      obst: [], water: { x: 800, y: 450, r: 120 }, sand: { x: 1050, y: 380, w: 120, h: 140 }, route: [[800, 265]] }
  ];

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const bgCanvas = document.createElement('canvas');
  const bgCtx = bgCanvas.getContext('2d');
  let view = { scale: 1, ox: 0, oy: 0, k: 1 };

  const game = {
    holeIdx: 0, hole: null, segs: [],
    phase: 'idle',            // idle | rolling | sunk
    strokes: 0, sunkTimer: 0, sunkFrom: null, fade: 1, banner: null,
    lastPos: [0, 0], splash: null, t: 0
  };
  const ball = { x: 0, y: 0, vx: 0, vy: 0 };
  const input = { x: 0, y: 0, dragging: false, lastActive: 0 };
  let botAim = null;

  const nowSec = () => performance.now() / 1000;
  input.lastActive = nowSec() - opts.delay + 2;   // CPU starts ~2s after load

  // ---- Geometry helpers -------------------------------------------------------------
  function polyEdges(p) { const e = []; for (let i = 0; i < p.length; i++) e.push([p[i], p[(i + 1) % p.length]]); return e; }

  function closestOnSeg(px, py, a, b) {
    const abx = b[0] - a[0], aby = b[1] - a[1];
    const t = Math.max(0, Math.min(1, ((px - a[0]) * abx + (py - a[1]) * aby) / (abx * abx + aby * aby)));
    return [a[0] + abx * t, a[1] + aby * t];
  }

  function inWater(x, y, pad) {
    const w = game.hole.water;
    return !!w && Math.hypot(x - w.x, y - w.y) < w.r + (pad || 0);
  }

  function inSand(x, y) {
    const s = game.hole.sand;
    return !!s && x > s.x && x < s.x + s.w && y > s.y && y < s.y + s.h;
  }

  function lineClear(ax, ay, bx, by) {
    const d = Math.hypot(bx - ax, by - ay);
    const n = Math.max(1, Math.ceil(d / 6));
    for (let i = 0; i <= n; i++) {
      const x = ax + ((bx - ax) * i) / n, y = ay + ((by - ay) * i) / n;
      if (inWater(x, y, R + 2)) return false;
      for (const [a, b] of game.segs) {
        const c = closestOnSeg(x, y, a, b);
        if (Math.hypot(x - c[0], y - c[1]) < R - 2) return false;
      }
    }
    return true;
  }

  // ---- Hole setup / static background ------------------------------------------------
  function loadHole(i) {
    game.holeIdx = i % HOLES.length;
    const h = (game.hole = HOLES[game.holeIdx]);
    game.segs = polyEdges(h.poly);
    h.obst.forEach((o) => game.segs.push(...polyEdges(o)));
    ball.x = h.tee[0]; ball.y = h.tee[1]; ball.vx = ball.vy = 0;
    game.lastPos = [ball.x, ball.y];
    game.strokes = 0; game.phase = 'idle'; game.sunkTimer = 0; game.banner = null; game.splash = null;
    game.fade = 1;
    botAim = null;
    buildBackground();
  }

  function pathPoly(c, p) { c.beginPath(); p.forEach((q, i) => (i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]))); c.closePath(); }

  function buildBackground() {
    const c = bgCtx, h = game.hole;
    c.setTransform(view.k, 0, 0, view.k, 0, 0);
    // rough
    const g = c.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#0f2a1b'); g.addColorStop(1, '#17402a');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 400; i++) {
      c.fillStyle = i % 2 ? 'rgba(60,130,70,0.10)' : 'rgba(0,0,0,0.10)';
      c.fillRect((i * 389) % W, (i * 233) % H, 3, 9);
    }
    // fairway w/ mowing stripes
    c.save();
    pathPoly(c, h.poly); c.clip();
    for (let x = -100, i = 0; x < W + 100; x += 64, i++) {
      c.fillStyle = i % 2 ? '#3f9e48' : '#48ab51';
      c.fillRect(x, 0, 64, H);
    }
    // sand
    if (h.sand) {
      const s = h.sand;
      c.fillStyle = '#e2cf93'; c.beginPath(); c.roundRect(s.x, s.y, s.w, s.h, 40); c.fill();
      c.fillStyle = 'rgba(160,130,70,0.35)';
      for (let i = 0; i < 90; i++) c.fillRect(s.x + ((i * 37) % s.w), s.y + ((i * 53) % s.h), 2, 2);
    }
    // water
    if (h.water) {
      const w = h.water;
      const wg = c.createRadialGradient(w.x - 30, w.y - 30, 10, w.x, w.y, w.r);
      wg.addColorStop(0, '#5fc3e8'); wg.addColorStop(1, '#1d6fa5');
      c.fillStyle = wg; c.beginPath(); c.arc(w.x, w.y, w.r, 0, Math.PI * 2); c.fill();
      c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 4; c.stroke();
    }
    // tee mat + cup
    c.fillStyle = 'rgba(255,255,255,0.85)';
    c.beginPath(); c.roundRect(h.tee[0] - 22, h.tee[1] - 22, 44, 44, 8); c.fill();
    c.fillStyle = '#14301f';
    c.beginPath(); c.arc(h.cup[0], h.cup[1], CUP_R + 3, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#05100a';
    c.beginPath(); c.arc(h.cup[0], h.cup[1], CUP_R, 0, Math.PI * 2); c.fill();
    c.restore();
    // obstacles
    h.obst.forEach((o) => {
      pathPoly(c, o); c.fillStyle = '#7a4a22'; c.fill();
      c.lineWidth = 6; c.strokeStyle = '#c99a5b'; c.lineJoin = 'round'; c.stroke();
    });
    // walls
    pathPoly(c, h.poly);
    c.lineJoin = 'round'; c.lineWidth = 18; c.strokeStyle = '#6b3f1d'; c.stroke();
    c.lineWidth = 6; c.strokeStyle = '#c99a5b'; c.stroke();
  }

  // ---- Shooting & physics -----------------------------------------------------------
  function shoot(angle, v0) {
    ball.vx = Math.cos(angle) * v0; ball.vy = Math.sin(angle) * v0;
    game.lastPos = [ball.x, ball.y];
    game.strokes++; game.phase = 'rolling';
  }

  function holeOut() {
    game.phase = 'sunk'; game.sunkTimer = 0; game.sunkFrom = [ball.x, ball.y];
    const d = game.strokes - game.hole.par;
    const label = game.strokes === 1 ? 'HOLE IN ONE!' : d <= -2 ? 'EAGLE!' : d === -1 ? 'BIRDIE!' : d === 0 ? 'PAR' : d === 1 ? 'BOGEY' : '+' + d;
    game.banner = { title: label, sub: game.strokes + (game.strokes === 1 ? ' STROKE' : ' STROKES'), t: 0 };
  }

  function stepBall(dt) {
    const h = game.hole;
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;

    for (const [a, b] of game.segs) {
      const c = closestOnSeg(ball.x, ball.y, a, b);
      let dx = ball.x - c[0], dy = ball.y - c[1];
      let d = Math.hypot(dx, dy);
      if (d < R) {
        if (d < 1e-6) { dx = -(b[1] - a[1]); dy = b[0] - a[0]; d = Math.hypot(dx, dy); }
        const nx = dx / d, ny = dy / d;
        ball.x += nx * (R - d); ball.y += ny * (R - d);
        const dot = ball.vx * nx + ball.vy * ny;
        if (dot < 0) { ball.vx -= (1 + REST) * dot * nx; ball.vy -= (1 + REST) * dot * ny; }
      }
    }

    const k = inSand(ball.x, ball.y) ? K * 4 : K;
    const f = Math.exp(-k * dt);
    ball.vx *= f; ball.vy *= f;

    if (inWater(ball.x, ball.y, 0)) {            // splash: back to last spot, +1 penalty stroke
      game.splash = { x: ball.x, y: ball.y, t: 0 };
      ball.x = game.lastPos[0]; ball.y = game.lastPos[1]; ball.vx = ball.vy = 0;
      game.strokes++; game.phase = 'idle';
      return;
    }

    const speed = Math.hypot(ball.vx, ball.vy);
    if (Math.hypot(ball.x - h.cup[0], ball.y - h.cup[1]) < CUP_R - 3 && speed < CAPTURE_SPEED) { holeOut(); return; }
    if (speed < 8) { ball.vx = ball.vy = 0; game.phase = 'idle'; }
  }

  // ---- CPU golfer ------------------------------------------------------------------
  function planBot() {
    const h = game.hole;
    let tx = h.cup[0], ty = h.cup[1], toCup = true;
    if (!lineClear(ball.x, ball.y, tx, ty)) {
      toCup = false;
      let found = null;
      for (let i = h.route.length - 1; i >= 0; i--) {
        const w = h.route[i];
        if (Math.hypot(w[0] - ball.x, w[1] - ball.y) > 50 && lineClear(ball.x, ball.y, w[0], w[1])) { found = w; break; }
      }
      if (found) { tx = found[0]; ty = found[1]; }
      else { toCup = true; }   // nothing better: just have a go
    }
    const d = Math.hypot(tx - ball.x, ty - ball.y);
    const angle = Math.atan2(ty - ball.y, tx - ball.x) + (Math.random() * 2 - 1) * 0.03;
    const v0 = Math.min(MAXV, d * K * (toCup ? 1.1 : 1.0) * (1 + (Math.random() * 2 - 1) * 0.03));
    botAim = { angle, v0, t: 0 };
  }

  // ---- Input ----------------------------------------------------------------------
  function toLogical(e) {
    const dpr = window.devicePixelRatio || 1;
    return [(e.clientX * dpr - view.ox) / view.scale, (e.clientY * dpr - view.oy) / view.scale];
  }

  window.addEventListener('pointermove', (e) => {
    const p = toLogical(e); input.x = p[0]; input.y = p[1]; input.lastActive = nowSec();
  });
  window.addEventListener('pointerdown', (e) => {
    const p = toLogical(e); input.x = p[0]; input.y = p[1]; input.lastActive = nowSec();
    if (game.phase === 'idle') { input.dragging = true; botAim = null; }
  });
  window.addEventListener('pointerup', () => {
    input.lastActive = nowSec();
    if (!input.dragging) return;
    input.dragging = false;
    if (game.phase !== 'idle') return;
    const dx = ball.x - input.x, dy = ball.y - input.y;
    const len = Math.hypot(dx, dy);
    if (len < 15) return;
    shoot(Math.atan2(dy, dx), (Math.min(len, 320) / 320) * MAXV);
  });

  // ---- Rendering ------------------------------------------------------------------
  const FONT = '"Segoe UI","Helvetica Neue",Arial,sans-serif';

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const cw = Math.max(1, Math.round(window.innerWidth * dpr)), ch = Math.max(1, Math.round(window.innerHeight * dpr));
    canvas.width = cw; canvas.height = ch;
    const scale = Math.min(cw / W, ch / H);
    const k = Math.min(2.5, Math.max(1, scale));
    view = { scale, ox: (cw - W * scale) / 2, oy: (ch - H * scale) / 2, k };
    bgCanvas.width = Math.round(W * k); bgCanvas.height = Math.round(H * k);
    if (game.hole) buildBackground();
  }

  function drawAim(angle, power, color) {
    const len = 70 + power * 260;
    const ux = Math.cos(angle), uy = Math.sin(angle);
    ctx.save();
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.setLineDash([2, 14]);
    ctx.beginPath(); ctx.moveTo(ball.x + ux * 22, ball.y + uy * 22); ctx.lineTo(ball.x + ux * len, ball.y + uy * len); ctx.stroke();
    ctx.setLineDash([]);
    const ex = ball.x + ux * len, ey = ball.y + uy * len;
    ctx.beginPath();
    ctx.moveTo(ex + ux * 16, ey + uy * 16);
    ctx.lineTo(ex - uy * 10, ey + ux * 10);
    ctx.lineTo(ex + uy * 10, ey - ux * 10);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function powerColor(p) { return p < 0.5 ? '#fde047' : p < 0.8 ? '#fb923c' : '#f43f5e'; }

  function render() {
    const h = game.hole;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#10281a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(view.scale, 0, 0, view.scale, view.ox, view.oy);
    ctx.drawImage(bgCanvas, 0, 0, W, H);

    // water sheen
    if (h.water) {
      const w = h.water;
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 3;
      for (let i = 0; i < 3; i++) {
        const r = ((game.t * 0.25 + i / 3) % 1) * w.r;
        ctx.globalAlpha = 1 - r / w.r;
        ctx.beginPath(); ctx.arc(w.x, w.y, r, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    }
    if (game.splash) {
      const s = game.splash;
      ctx.save(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.globalAlpha = Math.max(0, 1 - s.t / 0.7);
      ctx.beginPath(); ctx.arc(s.x, s.y, 10 + s.t * 90, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }

    // flag
    const cx = h.cup[0], cy = h.cup[1], wave = Math.sin(game.t * 4) * 5;
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.moveTo(cx + 4, cy); ctx.lineTo(cx + 44, cy + 56); ctx.lineTo(cx + 22, cy + 62); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - 115); ctx.stroke();
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.moveTo(cx, cy - 115); ctx.lineTo(cx + 52 + wave, cy - 100); ctx.lineTo(cx, cy - 82); ctx.closePath(); ctx.fill();

    // ball
    let bx = ball.x, by = ball.y, br = R;
    if (game.phase === 'sunk') {
      const p = Math.min(1, game.sunkTimer / 0.3);
      bx = game.sunkFrom[0] + (cx - game.sunkFrom[0]) * p; by = game.sunkFrom[1] + (cy - game.sunkFrom[1]) * p; br = R * (1 - 0.85 * p);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.arc(bx + 4, by + 5, br, 0, Math.PI * 2); ctx.fill();
    const bg = ctx.createRadialGradient(bx - br * 0.4, by - br * 0.4, 1, bx, by, br);
    bg.addColorStop(0, '#ffffff'); bg.addColorStop(1, '#d4dbe5');
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();

    // aim indicators
    if (game.phase === 'idle') {
      if (input.dragging) {
        const dx = ball.x - input.x, dy = ball.y - input.y, len = Math.hypot(dx, dy);
        if (len >= 15) {
          const pw = Math.min(len, 320) / 320;
          ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(ball.x, ball.y); ctx.lineTo(input.x, input.y); ctx.stroke(); ctx.restore();
          drawAim(Math.atan2(dy, dx), pw, powerColor(pw));
        }
      } else if (botAim) {
        const pw = botAim.v0 / MAXV;
        drawAim(botAim.angle, pw, 'rgba(255,255,255,0.9)');
      }
    }

    // HUD
    ctx.setTransform(view.scale, 0, 0, view.scale, view.ox, view.oy);
    if (opts.hud) {
      ctx.save();
      ctx.globalAlpha = 0.75; ctx.fillStyle = '#ffffff'; ctx.textBaseline = 'alphabetic';
      ctx.font = '700 40px ' + FONT; ctx.textAlign = 'left';
      ctx.fillText('HOLE ' + (game.holeIdx + 1), 60, 80);
      ctx.font = '600 26px ' + FONT; ctx.fillStyle = '#d1fae5';
      ctx.fillText('PAR ' + h.par + '   ·   STROKES ' + game.strokes, 60, 118);
      if (nowSec() - input.lastActive < 4) {
        ctx.textAlign = 'right'; ctx.font = '600 24px ' + FONT; ctx.fillStyle = '#ecfccb';
        ctx.fillText('Drag back & release to putt', W - 60, 80);
      }
      ctx.restore();
    }
    if (game.banner) {
      const b = game.banner, a = Math.min(1, b.t / 0.2);
      ctx.save(); ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(8, 24, 14, 0.72)'; ctx.fillRect(W / 2 - 340, H / 2 - 95, 680, 190);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff'; ctx.font = 'italic 800 88px ' + FONT; ctx.fillText(b.title, W / 2, H / 2 - 18);
      ctx.fillStyle = '#fde047'; ctx.font = '600 32px ' + FONT; ctx.fillText(b.sub, W / 2, H / 2 + 52);
      ctx.restore();
    }
    if (game.fade > 0) {
      ctx.fillStyle = 'rgba(8, 24, 14,' + game.fade + ')';
      ctx.fillRect(-view.ox / view.scale, -view.oy / view.scale, canvas.width / view.scale, canvas.height / view.scale);
    }
  }

  // ---- Loop ------------------------------------------------------------------------
  let last = 0;
  const frameMs = 1000 / opts.fps;

  function tick(ts) {
    requestAnimationFrame(tick);
    if (document.hidden) { last = 0; return; }
    if (!last) last = ts;
    const elapsed = ts - last;
    if (elapsed < frameMs - 1) return;
    last = ts;
    const dt = Math.min(0.05, elapsed / 1000);
    game.t += dt;
    if (game.fade > 0) game.fade = Math.max(0, game.fade - dt / 0.7);
    if (game.splash) { game.splash.t += dt; if (game.splash.t > 0.7) game.splash = null; }
    if (game.banner) game.banner.t += dt;

    if (game.phase === 'rolling') {
      const n = 6;
      for (let i = 0; i < n && game.phase === 'rolling'; i++) stepBall(dt / n);
    } else if (game.phase === 'sunk') {
      game.sunkTimer += dt;
      if (game.sunkTimer > 2.0) loadHole(game.holeIdx + 1);
    } else if (game.phase === 'idle' && opts.auto && !input.dragging && nowSec() - input.lastActive > opts.delay) {
      if (!botAim) planBot();
      else { botAim.t += dt; if (botAim.t > 1.0) { const b = botAim; botAim = null; shoot(b.angle, b.v0); } }
    }
    render();
  }

  window.__golf = () => ({ hole: game.holeIdx, phase: game.phase, strokes: game.strokes, ball: [ball.x, ball.y], bot: !!botAim });

  window.addEventListener('resize', resize);
  resize();
  loadHole(0);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drifting Lights</title>
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #050814; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<!-- The engine's WebGPU stage (optional): the page works the same without it. -->
<script src="aero-wallpaper://engine/gpu-stage.js"></script>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  let w = 0, h = 0, dpr = 1, paused = false, last = 0, stage = null;
  const pointer = { x: -1, y: -1, on: false };
  const lights = Array.from({ length: 28 }, (_, i) => ({
    x: Math.random(), y: Math.random(), r: 0.05 + Math.random() * 0.12,
    vx: (Math.random() - 0.5) * 0.012, vy: (Math.random() - 0.5) * 0.008, hue: 190 + (i * 37) % 120, push: 0
  }));
  const bursts = [];

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function frame(t) {
    // Paused by the host (a full-screen app covers the desktop, or the user paused): draw nothing, check back now and then.
    if (paused) { last = t; setTimeout(() => requestAnimationFrame(frame), 400); return; }
    const dt = Math.min((t - last) / 1000 || 0.016, 0.05); last = t;
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#050814'); g.addColorStop(1, '#0b1730');
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    for (const l of lights) {
      // drift, and lean away from the cursor when it is near
      if (pointer.on) {
        const dx = l.x - pointer.x, dy = l.y - pointer.y, d = Math.hypot(dx, dy);
        if (d > 0 && d < 0.18) { l.vx += dx / d * 0.02 * dt; l.vy += dy / d * 0.02 * dt; }
      }
      l.vx *= 0.999; l.vy *= 0.999;
      l.x = (l.x + l.vx * dt * 6 + 1.2) % 1.2; l.y = (l.y + l.vy * dt * 6 + 1.2) % 1.2;
      const x = (l.x - 0.1) * w, y = (l.y - 0.1) * h, r = l.r * Math.min(w, h);
      const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, `hsla(${l.hue}, 85%, 62%, 0.30)`); rg.addColorStop(1, `hsla(${l.hue}, 85%, 62%, 0)`);
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i]; b.age += dt;
      if (b.age > 1.2) { bursts.splice(i, 1); continue; }
      ctx.strokeStyle = `rgba(190, 230, 255, ${(1 - b.age / 1.2) * 0.6})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.x * w, b.y * h, b.age * 160, 0, Math.PI * 2); ctx.stroke();
    }
    // With WebGPU: the finished frame through the engine's stage, here for a slow shimmer.
    if (stage) stage.render(t / 1000, { refract: 1.2, caustic: 0.03, scale: 4, topBias: 0 });
    requestAnimationFrame(frame);
  }

  // What the host calls (all optional): docs/WALLPAPERS.md, "Talking to the host".
  window.aeroWallpaper = {
    pause: (on) => { paused = !!on; },
    mouse: (x, y, click) => {
      if (x < 0) { pointer.on = false; return; }
      pointer.x = x + 0.1; pointer.y = y + 0.1; pointer.on = true;      // (the lights live on a sheet a tenth larger than the screen on each side)
      if (click) bursts.push({ x, y, age: 0 });
    },
    option: (name, value) => { if (name === 'gpu') useGpu(!!value); }
  };

  function useGpu(on) {
    if (!on) { if (stage) { stage.destroy(); stage = null; } return; }
    if (stage || !window.AeroGpuStage) return;
    window.AeroGpuStage.create(canvas, { onLost: () => { stage = null; } }).then((s) => { stage = s; });
  }

  addEventListener('resize', resize);
  resize();
  useGpu(new URLSearchParams(location.search).get('gpu') !== '0');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
